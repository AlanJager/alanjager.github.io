<svg xmlns="http://www.w3.org/2000/svg" width="960" height="590" viewBox="0 0 960 590" role="img" aria-label="显存中的专家怎样跟随热点变化？">
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#71818b"/></marker></defs>
    <style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif;fill:#20353e}.title{font-size:29px;font-weight:650}.sub{font-size:16px;fill:#60747b}.label{font-size:21px;font-weight:600}.small{font-size:17px}.arrow{fill:none;stroke:#71818b;stroke-width:2;marker-end:url(#arrow)}</style>
    <rect width="960" height="590" rx="14" fill="#f7f9f8"/>
    <text class="title" x="36" y="51">显存中的专家怎样跟随热点变化？</text><text class="sub" x="36" y="83">槽位管理与热度策略分工 · 机制示意</text><rect x="36" y="118" width="888" height="92" rx="10" fill="#e4eff1"/><text class="label" x="56" y="152">驻留表：（层号，专家号）→ 槽位</text><text class="small" x="56" y="182">查到槽位：读取显存中的权重；未驻留：进入显存外专家分工</text><rect x="36" y="245" width="424" height="120" rx="10" fill="#e4eff1"/><text class="label" x="56" y="279">空槽准入</text><text class="small" x="56" y="309">admit() 填入空槽</text><text class="small" x="56" y="335">槽位已满时，返回未驻留</text><rect x="500" y="245" width="424" height="120" rx="10" fill="#e4eff1"/><text class="label" x="520" y="279">运行期间的热度交换</text><text class="small" x="520" y="309">累计路由次数，并衰减历史热度</text><text class="small" x="520" y="335">同层热专家与冷专家配对</text><path class="arrow" d="M712 366V401"/><rect x="36" y="405" width="888" height="112" rx="10" fill="#e4eff1"/><text class="label" x="56" y="439">安排交换 → 复制权重 → 确认就绪 → 发布映射</text><text class="small" x="56" y="469">达到热度差阈值，且受每轮交换数量限制。</text><text class="small" x="56" y="495">复用槽位前处理旧读者的依赖；新权重复制完成后标记为可用。</text><text class="sub" x="36" y="555">收益来自后续复用；交换本身也要占用带宽和同步时间。</text></svg>