<svg xmlns="http://www.w3.org/2000/svg" width="960" height="904" viewBox="0 0 960 904" role="img" aria-label="少量专家，怎样让多个 CPU 核心一起工作？">
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#71818b"/></marker></defs>
    <style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif;fill:#20353e}.title{font-size:29px;font-weight:650}.sub{font-size:16px;fill:#60747b}.label{font-size:21px;font-weight:600}.small{font-size:17px}.arrow{fill:none;stroke:#71818b;stroke-width:2;marker-end:url(#arrow)}</style>
    <rect width="960" height="904" rx="14" fill="#f7f9f8"/>
    <text class="title" x="36" y="51">少量专家，怎样让多个 CPU 核心一起工作？</text><text class="sub" x="36" y="83">按权重行划分任务 · 同一行连续服务多个 token</text><rect x="36" y="117" width="888" height="98" rx="10" fill="#e4eff1"/><text class="label" x="56" y="151">三个 token 选中了同一个专家</text><text class="small" x="56" y="181">输入 xA、xB、xC 各自保留；共用同一组专家权重。</text><text class="label" x="56" y="259">gate / up 权重行</text><rect x="56" y="278" width="220" height="23" rx="3" fill="#c6dde5"/><text x="68" y="295" style="font-size:14px">行 0　[ 权重向量 … ]</text><rect x="56" y="304" width="220" height="23" rx="3" fill="#c6dde5"/><text x="68" y="321" style="font-size:14px">行 1　[ 权重向量 … ]</text><rect x="56" y="330" width="220" height="23" rx="3" fill="#c6dde5"/><text x="68" y="347" style="font-size:14px">行 2　[ 权重向量 … ]</text><rect x="56" y="356" width="220" height="23" rx="3" fill="#c6dde5"/><text x="68" y="373" style="font-size:14px">行 3　[ 权重向量 … ]</text><rect x="56" y="382" width="220" height="23" rx="3" fill="#d6dfbd"/><text x="68" y="399" style="font-size:14px">行 4　[ 权重向量 … ]</text><rect x="56" y="408" width="220" height="23" rx="3" fill="#d6dfbd"/><text x="68" y="425" style="font-size:14px">行 5　[ 权重向量 … ]</text><rect x="56" y="434" width="220" height="23" rx="3" fill="#d6dfbd"/><text x="68" y="451" style="font-size:14px">行 6　[ 权重向量 … ]</text><rect x="56" y="460" width="220" height="23" rx="3" fill="#d6dfbd"/><text x="68" y="477" style="font-size:14px">行 7　[ 权重向量 … ]</text><path class="arrow" d="M277 328H343"/><path class="arrow" d="M277 432H343"/><rect x="350" y="269" width="574" height="102" rx="10" fill="#e4eff1"/><text class="label" x="370" y="303">线程 A：领取行 0～3</text><text class="small" x="370" y="333">每一行分别与 xA、xB、xC 做点积</text><text class="small" x="370" y="359">写出三个 token 各自对应的分量。</text><rect x="350" y="393" width="574" height="102" rx="10" fill="#e9eddf"/><text class="label" x="370" y="427">线程 B：领取行 4～7</text><text class="small" x="370" y="457">处理另一段行，也使用 xA、xB、xC</text><text class="small" x="370" y="483">两个线程覆盖不同的输出分量。</text><path class="arrow" d="M480 496V535"/><rect x="36" y="539" width="888" height="108" rx="10" fill="#e4eff1"/><text class="label" x="56" y="573">gate/up 阶段完成 → 中间激活 → 量化</text><text class="small" x="56" y="603">分别为 A、B、C 形成 h = SiLU(gate(x)) ⊙ up(x)。</text><text class="small" x="56" y="629">把各自的 h 量化为 down kernel 使用的格式。</text><path class="arrow" d="M480 648V687"/><rect x="36" y="691" width="888" height="108" rx="10" fill="#f2e7d6"/><text class="label" x="56" y="725">down 矩阵继续按行分工 → 三份专家输出</text><text class="small" x="56" y="755">工作线程使用不同的 down 权重行，计算 A、B、C 各自的结果。</text><text class="small" x="56" y="781">同一权重行服务多个输入，每个 token 的乘加与输出分别完成。</text><text class="sub" x="36" y="842">八行、两个线程为示意；实际行任务动态领取，也可以跨专家边界。</text><text class="sub" x="36" y="870">行拆分增加可并行的工作；多 token 分组摊薄权重读取成本。</text></svg>