<svg xmlns="http://www.w3.org/2000/svg" width="960" height="919" viewBox="0 0 960 919" role="img" aria-label="多条计算路径，怎样合成一个 token 的结果？">
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#71818b"/></marker></defs>
    <style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif;fill:#20353e}.title{font-size:29px;font-weight:650}.sub{font-size:16px;fill:#60747b}.label{font-size:21px;font-weight:600}.small{font-size:17px}.arrow{fill:none;stroke:#71818b;stroke-width:2;marker-end:url(#arrow)}</style>
    <rect width="960" height="919" rx="14" fill="#f7f9f8"/>
    <text class="title" x="36" y="51">多条计算路径，怎样合成一个 token 的结果？</text><text class="sub" x="36" y="83">以下展开一个 token；x 是专家输入，Eᵢ(x) 是第 i 个选中专家的输出</text><rect x="36" y="126" width="276" height="136" rx="10" fill="#e4eff1"/><text class="label" x="56" y="160">显存命中的专家</text><text class="small" x="56" y="190">GPU 计算 Eᵢ(x)</text><text class="small" x="56" y="216">输出已在 GPU 上</text><rect x="342" y="126" width="276" height="136" rx="10" fill="#f2e7d6"/><text class="label" x="362" y="160">PCIe 搬入的专家</text><text class="small" x="362" y="190">权重就绪后 GPU 计算</text><text class="small" x="362" y="216">输出已在 GPU 上</text><rect x="648" y="126" width="276" height="136" rx="10" fill="#e9eddf"/><text class="label" x="668" y="160">CPU 计算的专家</text><text class="small" x="668" y="190">CPU 计算完成，发布就绪</text><text class="small" x="668" y="216">输出经 PCIe 交给 GPU</text><path d="M174 263V304H480" fill="none" stroke="#71818b" stroke-width="2"/><path d="M480 263V304H480" fill="none" stroke="#71818b" stroke-width="2"/><path d="M786 263V304H480" fill="none" stroke="#71818b" stroke-width="2"/><path class="arrow" d="M480 304V338"/><rect x="36" y="342" width="888" height="108" rx="10" fill="#e4eff1"/><text class="label" x="56" y="376">① 等待结果就绪，按 token 与路由位置对应输出</text><text class="small" x="56" y="406">GPU 与 CPU 的各份结果回到对应位置；同一条路由贡献计入一次。</text><text class="small" x="56" y="432">不同专家可以来自不同设备，合并时使用各自的输出向量。</text><path class="arrow" d="M313 451V489"/><rect x="36" y="493" width="554" height="140" rx="10" fill="#e4eff1"/><text class="label" x="56" y="527">② 按路由权重相乘，再求和</text><text class="small" x="56" y="557">路由器给出每个选中专家的权重 wᵢ</text><text class="small" x="56" y="583">对该 token：r(x) = Σ wᵢ · Eᵢ(x)</text><text class="small" x="56" y="609">求和范围是这个 token 选中的路由专家</text><rect x="624" y="493" width="300" height="140" rx="10" fill="#e9eddf"/><text class="label" x="644" y="527">共享专家 · GPU</text><text class="small" x="644" y="557">使用同一输入 x 计算</text><text class="small" x="644" y="583">经过共享门控</text><text class="small" x="644" y="609">得到共享贡献 s(x)</text><path d="M313 634V674H774V634" fill="none" stroke="#71818b" stroke-width="2"/><path class="arrow" d="M480 674V708"/><rect x="36" y="712" width="888" height="106" rx="10" fill="#e4eff1"/><text class="label" x="56" y="746">③ 加入共享贡献，得到 MoE 模块输出</text><text class="small" x="56" y="776">MoE(x) = r(x) + s(x)</text><text class="small" x="56" y="802">输出交给本层后续计算。</text><text class="sub" x="36" y="858">图示为数学与数据依赖；实现可融合 kernel。共享专家可与路由专家计算重叠。</text><text class="sub" x="36" y="886">启用尾部跳过时，被跳过专家对应的贡献为零，其他路由权重保持原值。</text></svg>