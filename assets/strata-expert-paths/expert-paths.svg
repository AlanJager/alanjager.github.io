<svg xmlns="http://www.w3.org/2000/svg" width="960" height="715" viewBox="0 0 960 715" role="img" aria-label="一个专家，这一轮交给谁计算？">
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#71818b"/></marker></defs>
    <style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif;fill:#20353e}.title{font-size:29px;font-weight:650}.sub{font-size:16px;fill:#60747b}.label{font-size:21px;font-weight:600}.small{font-size:17px}.arrow{fill:none;stroke:#71818b;stroke-width:2;marker-end:url(#arrow)}</style>
    <rect width="960" height="715" rx="14" fill="#f7f9f8"/>
    <text class="title" x="36" y="51">一个专家，这一轮交给谁计算？</text><text class="sub" x="36" y="83">Strata 0.1.43 · 单 GPU 常规 DMA 路径 · 机制示意</text><rect x="36" y="115" width="888" height="88" rx="10" fill="#e4eff1"/><text class="label" x="56" y="149">本层路由与分组</text><text class="small" x="56" y="179">按（层号，专家号）去重；同一专家可服务窗口内多个 token</text><path class="arrow" d="M174 204V241"/><path class="arrow" d="M480 204V241"/><path class="arrow" d="M786 204V241"/><rect x="36" y="245" width="276" height="170" rx="10" fill="#e4eff1"/><text class="label" x="56" y="279">显存命中 → GPU</text><text class="small" x="56" y="309">权重：留在显存</text><text class="small" x="56" y="335">GPU 读取并计算</text><text class="small" x="56" y="361">本轮无需搬入专家权重</text><rect x="342" y="245" width="276" height="170" rx="10" fill="#e9eddf"/><text class="label" x="362" y="279">RAM → CPU</text><text class="small" x="362" y="309">权重：留在 RAM</text><text class="small" x="362" y="335">激活交给 CPU 计算</text><text class="small" x="362" y="361">输出经 PCIe 交回 GPU</text><rect x="648" y="245" width="276" height="170" rx="10" fill="#f2e7d6"/><text class="label" x="668" y="279">RAM → PCIe → GPU</text><text class="small" x="668" y="309">权重：搬入显存暂存区</text><text class="small" x="668" y="335">复制完成后 GPU 计算</text><text class="small" x="668" y="361">同组 token 共用这份权重</text><path class="arrow" d="M174 416V455"/><path class="arrow" d="M480 416V455"/><path class="arrow" d="M786 416V455"/><rect x="36" y="459" width="888" height="88" rx="10" fill="#e4eff1"/><text class="label" x="56" y="493">GPU 合并 MoE 结果</text><text class="small" x="56" y="523">按路由权重合并专家输出，加入共享专家贡献，交给本层后续计算</text><rect x="36" y="572" width="888" height="112" rx="10" fill="#f1e2e0"/><text class="label" x="56" y="606">默认优化中的另一分支：尾部跳过</text><text class="small" x="56" y="636">满足条件的低排名未命中专家贡献置零，减少计算与搬运。</text><text class="small" x="56" y="662">这是输出会变化的策略；比较硬件时单独记录开关与跳过计数。</text></svg>