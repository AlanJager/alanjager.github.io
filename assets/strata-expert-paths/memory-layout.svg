<svg xmlns="http://www.w3.org/2000/svg" width="960" height="809" viewBox="0 0 960 809" role="img" aria-label="模型数据放在哪里？">
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#71818b"/></marker></defs>
    <style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif;fill:#20353e}.title{font-size:29px;font-weight:650}.sub{font-size:16px;fill:#60747b}.label{font-size:21px;font-weight:600}.small{font-size:17px}.arrow{fill:none;stroke:#71818b;stroke-width:2;marker-end:url(#arrow)}</style>
    <rect width="960" height="809" rx="14" fill="#f7f9f8"/>
    <text class="title" x="36" y="51">模型数据放在哪里？</text><text class="sub" x="36" y="83">Strata 0.1.43 · 本轮 resident RAM 模式</text><rect x="36" y="117" width="424" height="458" rx="12" fill="#e4eff1"/><rect x="500" y="117" width="424" height="458" rx="12" fill="#e9eddf"/><text class="label" x="60" y="154">GPU · 显存</text><text class="label" x="524" y="154">CPU · 系统内存 RAM</text><rect x="56" y="177" width="384" height="107" rx="10" fill="#fff"/><text class="label" x="76" y="211">常用专家权重</text><text class="small" x="76" y="241">专家缓存：GPU 直接读取</text><text class="small" x="76" y="267">热点变化时与 RAM 中的专家交换</text><rect x="56" y="300" width="384" height="107" rx="10" fill="#fff"/><text class="label" x="76" y="334">其他模型权重</text><text class="small" x="76" y="364">注意力 / DeltaNet、路由器</text><text class="small" x="76" y="390">共享专家、输出头、MTP</text><rect x="56" y="423" width="384" height="129" rx="10" fill="#fff"/><text class="label" x="76" y="457">运行状态与缓冲</text><text class="small" x="76" y="487">KV 等上下文状态、激活与输出</text><text class="small" x="76" y="513">专家搬运暂存区、计算工作空间</text><text class="small" x="76" y="539">这些分配共同占用显存</text><rect x="520" y="177" width="384" height="107" rx="10" fill="#fff"/><text class="label" x="540" y="211">显存外的专家权重</text><text class="small" x="540" y="241">本轮使用锁页的专家补集</text><text class="small" x="540" y="267">CPU 计算，或搬到 GPU 计算</text><rect x="520" y="300" width="384" height="107" rx="10" fill="#fff"/><text class="label" x="540" y="334">主机工作缓冲</text><text class="small" x="540" y="364">CPU 使用的激活与专家输出</text><text class="small" x="540" y="390">锁页缓冲与调度数据</text><rect x="520" y="423" width="384" height="129" rx="10" fill="#fff"/><text class="label" x="540" y="457">文件页缓存</text><text class="small" x="540" y="487">本轮 PLE 表采用 mmap</text><text class="small" x="540" y="513">读入的文件页由操作系统缓存</text><text class="small" x="540" y="539">缺失的页从存储读取</text><path class="arrow" d="M250 576V601H708V577" marker-start="url(#arrow)"/><rect x="321" y="581" width="318" height="40" rx="8" fill="#f2e7d6"/><text class="small" x="340" y="607">PCIe：专家权重、激活与结果</text><rect x="36" y="651" width="888" height="86" rx="10" fill="#edeae5"/><text class="label" x="56" y="685">磁盘：模型文件、专家 pack、MTP 数据与 PLE 表</text><text class="small" x="56" y="715">加载与文件页读取把数据送入内存；推理期间的常驻布局见上图。</text><text class="sub" x="36" y="775">本轮 3090 / 32GB / 32K 上下文布局；矩形面积不表示容量比例。</text></svg>