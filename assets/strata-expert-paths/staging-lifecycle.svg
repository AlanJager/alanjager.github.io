<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1014" viewBox="0 0 960 1014" role="img" aria-label="提前搬入下一组专家，怎样缩短等待？">
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#71818b"/></marker></defs>
    <style>text{font-family:'PingFang SC','Microsoft YaHei',sans-serif;fill:#20353e}.title{font-size:29px;font-weight:650}.sub{font-size:16px;fill:#60747b}.label{font-size:21px;font-weight:600}.small{font-size:17px}.arrow{fill:none;stroke:#71818b;stroke-width:2;marker-end:url(#arrow)}</style>
    <rect width="960" height="1014" rx="14" fill="#f7f9f8"/>
    <text class="title" x="36" y="51">提前搬入下一组专家，怎样缩短等待？</text><text class="sub" x="36" y="83">prefill · 主机准备、PCIe 复制与 GPU 计算的重叠</text><path class="arrow" d="M200 127H914"/><text x="200" y="115" text-anchor="start" style="font-size:16px;fill:#20353e">时间向右 → 相同示意工作量，统一横轴，无实测刻度</text><text x="36" y="188" text-anchor="start" style="font-size:21px;fill:#20353e">逐组串行</text><text x="36" y="216" text-anchor="start" style="font-size:16px;fill:#20353e">复制 → 计算</text><rect x="240" y="172" width="80" height="46" rx="5" fill="#efd5ac"/><text x="280.0" y="201" text-anchor="middle" style="font-size:16px;fill:#20353e">复制 A</text><rect x="320" y="172" width="120" height="46" rx="5" fill="#b8d8e4"/><text x="380.0" y="201" text-anchor="middle" style="font-size:16px;fill:#20353e">读取 / 计算 A</text><rect x="440" y="172" width="80" height="46" rx="5" fill="#efd5ac"/><text x="480.0" y="201" text-anchor="middle" style="font-size:16px;fill:#20353e">复制 B</text><rect x="520" y="172" width="120" height="46" rx="5" fill="#b8d8e4"/><text x="580.0" y="201" text-anchor="middle" style="font-size:16px;fill:#20353e">读取 / 计算 B</text><rect x="640" y="172" width="80" height="46" rx="5" fill="#efd5ac"/><text x="680.0" y="201" text-anchor="middle" style="font-size:16px;fill:#20353e">复制 C</text><rect x="720" y="172" width="120" height="46" rx="5" fill="#b8d8e4"/><text x="780.0" y="201" text-anchor="middle" style="font-size:16px;fill:#20353e">读取 / 计算 C</text><line x1="840" y1="218" x2="840" y2="711" stroke="#a2abae" stroke-dasharray="5 5"/><text x="840" y="244" text-anchor="middle" style="font-size:16px;fill:#20353e">串行完成</text><text x="36" y="303" text-anchor="start" style="font-size:23px;fill:#20353e">循环槽位流水线</text><text x="36" y="332" text-anchor="start" style="font-size:17px;fill:#20353e">A、B、C 表示依次处理的专家工作单元；用两个暂存槽举例。</text><rect x="344" y="464" width="56" height="210" fill="#e0ead6" opacity="0.75"/><line x1="200" y1="405" x2="915" y2="405" stroke="#d4dcdf"/><line x1="200" y1="520" x2="915" y2="520" stroke="#d4dcdf"/><line x1="200" y1="660" x2="915" y2="660" stroke="#d4dcdf"/><text x="36" y="390" text-anchor="start" style="font-size:21px;fill:#20353e">主机准备</text><text x="36" y="415" text-anchor="start" style="font-size:16px;fill:#20353e">转入锁页缓冲</text><rect x="200" y="374" width="40" height="46" rx="5" fill="#d4debf"/><text x="220.0" y="403" text-anchor="middle" style="font-size:16px;fill:#20353e">A</text><rect x="240" y="374" width="40" height="46" rx="5" fill="#d4debf"/><text x="260.0" y="403" text-anchor="middle" style="font-size:16px;fill:#20353e">B</text><rect x="280" y="374" width="40" height="46" rx="5" fill="#d4debf"/><text x="300.0" y="403" text-anchor="middle" style="font-size:16px;fill:#20353e">C</text><text x="338" y="394" text-anchor="start" style="font-size:15px;fill:#20353e">未锁页权重先准备；已锁页权重可直接进入复制流</text><text x="36" y="506" text-anchor="start" style="font-size:21px;fill:#20353e">H2D 复制流</text><text x="36" y="531" text-anchor="start" style="font-size:16px;fill:#20353e">轮换两个槽位</text><rect x="240" y="484" width="80" height="46" rx="5" fill="#efd5ac"/><text x="280.0" y="513" text-anchor="middle" style="font-size:16px;fill:#20353e">A → 槽0</text><rect x="320" y="484" width="80" height="46" rx="5" fill="#efd5ac"/><text x="360.0" y="513" text-anchor="middle" style="font-size:16px;fill:#20353e">B → 槽1</text><rect x="400" y="484" width="80" height="46" rx="5" fill="#efd5ac"/><text x="440.0" y="513" text-anchor="middle" style="font-size:16px;fill:#20353e">C → 槽0</text><path d="M240 420V480" stroke="#85968c" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/><path d="M280 420V450H320V480" stroke="#85968c" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/><path d="M320 420V438H400V480" stroke="#85968c" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow)"/><text x="36" y="641" text-anchor="start" style="font-size:21px;fill:#20353e">GPU 计算流</text><text x="36" y="667" text-anchor="start" style="font-size:16px;fill:#20353e">G → 专家计算</text><rect x="320" y="624" width="24" height="46" rx="5" fill="#799da9"/><text x="332.0" y="653" text-anchor="middle" style="font-size:16px;fill:#fff">G</text><rect x="344" y="624" width="96" height="46" rx="5" fill="#b8d8e4"/><text x="392.0" y="653" text-anchor="middle" style="font-size:16px;fill:#20353e">计算 A</text><rect x="440" y="624" width="24" height="46" rx="5" fill="#799da9"/><text x="452.0" y="653" text-anchor="middle" style="font-size:16px;fill:#fff">G</text><rect x="464" y="624" width="96" height="46" rx="5" fill="#b8d8e4"/><text x="512.0" y="653" text-anchor="middle" style="font-size:16px;fill:#20353e">计算 B</text><rect x="560" y="624" width="24" height="46" rx="5" fill="#799da9"/><text x="572.0" y="653" text-anchor="middle" style="font-size:16px;fill:#fff">G</text><rect x="584" y="624" width="96" height="46" rx="5" fill="#b8d8e4"/><text x="632.0" y="653" text-anchor="middle" style="font-size:16px;fill:#20353e">计算 C</text><path class="arrow" d="M320 531V620"/><text x="218" y="567" text-anchor="start" style="font-size:16px;fill:#20353e">copied A</text><text x="211" y="590" text-anchor="start" style="font-size:14px;fill:#20353e">复制完成才读取</text><path d="M344 624V574H400V534" stroke="#506f46" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="412" y="575" text-anchor="start" style="font-size:16px;fill:#506f46">used A：槽 0 已读完，C 可以覆盖</text><text x="498" y="513" text-anchor="start" style="font-size:16px;fill:#20353e">B、C 提前搬入，等计算流轮到自己</text><line x1="680" y1="670" x2="680" y2="711" stroke="#46758a" stroke-width="2"/><path d="M680 706H840" stroke="#46758a" stroke-width="2"/><text x="680" y="738" text-anchor="middle" style="font-size:16px;fill:#285d72">流水线完成</text><text x="760" y="769" text-anchor="middle" style="font-size:16px;fill:#285d72">这一段等待被重叠隐藏</text><rect x="36" y="808" width="888" height="108" rx="10" fill="#e4eff1"/><text class="label" x="56" y="842">图里重叠的是哪一段？</text><text class="small" x="56" y="872">淡绿色竖带：GPU 正在计算 A，复制流同时把 B 搬入槽 1。</text><text class="small" x="56" y="898">随后 C 复用槽 0；A 的计算继续使用已 gather 到计算缓冲中的权重。</text><text x="36" y="951" text-anchor="start" style="font-size:16px;fill:#20353e">G = gather：读取暂存槽并放入计算缓冲，完成后记录 used。</text><text x="36" y="980" text-anchor="start" style="font-size:16px;fill:#20353e">机制时间轴，块长为示意；实际重叠取决于数据就绪、槽位和设备资源。</text></svg>