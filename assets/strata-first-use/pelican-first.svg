<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Background -->
  <rect width="400" height="300" fill="#87CEEB"/>
  
  <!-- Ground -->
  <rect x="0" y="250" width="400" height="50" fill="#8B7355"/>
  
  <!-- Bicycle -->
  <!-- Rear wheel -->
  <circle cx="120" cy="220" r="40" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="120" cy="220" r="35" fill="none" stroke="#333" stroke-width="2"/>
  <!-- Spokes -->
  <line x1="120" y1="180" x2="120" y2="260" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="220" x2="160" y2="220" stroke="#333" stroke-width="1.5"/>
  <line x1="92" y1="192" x2="148" y2="248" stroke="#333" stroke-width="1.5"/>
  <line x1="148" y1="192" x2="92" y2="248" stroke="#333" stroke-width="1.5"/>
  
  <!-- Front wheel -->
  <circle cx="280" cy="220" r="40" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="280" cy="220" r="35" fill="none" stroke="#333" stroke-width="2"/>
  <!-- Spokes -->
  <line x1="280" y1="180" x2="280" y2="260" stroke="#333" stroke-width="1.5"/>
  <line x1="240" y1="220" x2="320" y2="220" stroke="#333" stroke-width="1.5"/>
  <line x1="252" y1="192" x2="308" y2="248" stroke="#333" stroke-width="1.5"/>
  <line x1="308" y1="192" x2="252" y2="248" stroke="#333" stroke-width="1.5"/>
  
  <!-- Frame -->
  <line x1="120" y1="220" x2="200" y2="180" stroke="#333" stroke-width="4"/>
  <line x1="200" y1="180" x2="280" y2="220" stroke="#333" stroke-width="4"/>
  <line x1="200" y1="180" x2="200" y2="140" stroke="#333" stroke-width="4"/>
  <line x1="200" y1="140" x2="240" y2="140" stroke="#333" stroke-width="4"/>
  <line x1="240" y1="140" x2="280" y2="220" stroke="#333" stroke-width="4"/>
  <line x1="120" y1="220" x2="200" y2="140" stroke="#333" stroke-width="4"/>
  
  <!-- Handlebars -->
  <line x1="240" y1="140" x2="260" y2="130" stroke="#333" stroke-width="3"/>
  <line x1="240" y1="140" x2="220" y2="130" stroke="#333" stroke-width="3"/>
  
  <!-- Seat -->
  <ellipse cx="200" cy="140" rx="15" ry="8" fill="#333"/>
  
  <!-- Pedals -->
  <circle cx="200" cy="180" r="8" fill="#333"/>
  <line x1="200" y1="180" x2="190" y2="195" stroke="#333" stroke-width="3"/>
  <line x1="200" y1="180" x2="210" y2="165" stroke="#333" stroke-width="3"/>
  
  <!-- Pelican -->
  <!-- Body -->
  <ellipse cx="200" cy="120" rx="35" ry="25" fill="#F5F5DC"/>
  
  <!-- Neck -->
  <path d="M 200 120 Q 210 100 220 90" fill="none" stroke="#F5F5DC" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Head -->
  <circle cx="225" cy="85" r="12" fill="#F5F5DC"/>
  
  <!-- Beak -->
  <path d="M 225 85 L 260 80 L 255 90 L 225 85 Z" fill="#E8A317"/>
  <!-- Beak pouch -->
  <path d="M 225 85 Q 240 95 255 90 L 250 85 Z" fill="#E8A317" opacity="0.7"/>
  
  <!-- Eye -->
  <circle cx="222" cy="82" r="3" fill="#333"/>
  
  <!-- Wing -->
  <path d="M 195 115 Q 180 105 175 115 Q 185 125 195 115 Z" fill="#E8E8E8"/>
  
  <!-- Tail -->
  <path d="M 165 120 L 155 115 L 160 125 Z" fill="#E8E8E8"/>
  
  <!-- Legs -->
  <line x1="195" y1="140" x2="190" y2="165" stroke="#E8A317" stroke-width="3"/>
  <line x1="205" y1="140" x2="210" y2="165" stroke="#E8A317" stroke-width="3"/>
  
  <!-- Feet on pedals -->
  <circle cx="190" cy="165" r="4" fill="#E8A317"/>
  <circle cx="210" cy="165" r="4" fill="#E8A317"/>
  
  <!-- Sun -->
  <circle cx="350" cy="50" r="20" fill="#FFD700"/>
  
  <!-- Clouds -->
  <ellipse cx="80" cy="60" rx="25" ry="12" fill="white" opacity="0.8"/>
  <ellipse cx="100" cy="55" rx="20" ry="10" fill="white" opacity="0.8"/>
  <ellipse cx="300" cy="40" rx="22" ry="10" fill="white" opacity="0.8"/>
</svg>