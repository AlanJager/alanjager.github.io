<div class="method-grid"><article class="method"><span class="tag">BASELINE</span><h3>RTN</h3><p>直接四舍五入到最近的刻度。无需校准样本，成本低；很低位数时容易损伤敏感权重。</p></article><article class="method"><span class="tag">WEIGHT ONLY</span><h3>GPTQ</h3><p>观察校准输入，逐步量化权重并补偿其余权重，目标是减小层输出误差。<a href="#ref-gptq">[1]</a></p></article><article class="method"><span class="tag">WEIGHT ONLY</span><h3>AWQ</h3><p>依据激活分布找出敏感权重通道，用等价缩放保护它们。<a href="#ref-awq">[2]</a></p></article><article class="method"><span class="tag">WEIGHT + ACTIVATION</span><h3>SmoothQuant</h3><p>针对难量化的激活离群值，把部分量化难度转移到权重，服务于 INT8 W8A8。<a href="#ref-sq">[3]</a></p></article></div>
