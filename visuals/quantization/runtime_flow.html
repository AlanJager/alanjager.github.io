<div class="runtime"><div><span class="phase">LOAD</span><strong>读取压缩权重</strong><small>加载 packed codes、scale、必要的 zero-point；某些后端可能重排布局。</small></div><div><span class="phase">PREFILL / DECODE</span><strong>准备当前激活</strong><small>W4A16 保留 16 bit 激活；W8A8 将当前激活转换为 8 bit。</small></div><div><span class="phase">GEMM</span><strong>低精度矩阵乘法</strong><small>内核边解包/缩放边计算，或直接用 INT8/FP8 硬件路径。</small></div><div><span class="phase">STATE</span><strong>写入 K/V</strong><small>KV Cache 精度单独配置，随 token 和并发累积。</small></div></div>
